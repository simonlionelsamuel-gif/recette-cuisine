name: APK Android

on:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest', 'icons/**', 'android-res/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KS_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets de signature
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "Secrets KS_B64 et KS_PASS manquants (Settings > Secrets and variables > Actions)."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Préparer le projet Android (Capacitor)
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js icons www/
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Nos courses" ch.noscourses.app --web-dir www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android

      - name: Compiler
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signer
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias courses --ks-pass env:KS_PASS --key-pass env:KS_PASS --out nos-courses.apk aligned.apk
          $BT/apksigner verify nos-courses.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nos courses 1.0.${{ github.run_number }}
          body: Installation et mises à jour via Obtainium.
          files: nos-courses.apk
